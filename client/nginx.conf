server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for hashed assets, no caching for index.html.
    location /static/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: send anything that isn't a real file to index.html so
    # client-side routing works on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
